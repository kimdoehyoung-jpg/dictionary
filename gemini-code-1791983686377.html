<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Voca Master</title>
    <!-- 분리된 CSS 파일 연결 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app-container">
    <!-- 메인 화면 -->
    <div id="main-screen" class="screen active">
        <div class="header">
            <h1>TOEIC Voca Master</h1>
        </div>
        <div style="text-align: center; margin-top: 20px; color: #4b5563;">
            <p>목표: TOEIC 600점 ~ 990점</p>
            <p>현재 등록된 단어: <span id="total-words-count">0</span>개</p>
        </div>
        <div class="menu-grid">
            <button class="menu-btn" onclick="startTest()">시험</button>
            <button class="menu-btn" onclick="showScreen('manage-screen')">단어 관리</button>
            <button class="menu-btn" onclick="showScreen('history-screen')">시험 기록 조회</button>
        </div>
    </div>

    <!-- 시험 화면 -->
    <div id="test-screen" class="screen">
        <div class="header">
            <h1>시험 진행 중</h1>
            <button class="btn-secondary" onclick="showScreen('main-screen')">⬅ 메인으로</button>
        </div>
        <div class="test-container" id="test-area">
            <div id="test-progress" style="margin-bottom: 16px; color: #6b7280; font-weight: bold;">문제 1 / 10</div>
            
            <div class="test-word" id="test-question">Word</div>
            
            <div class="tts-group" style="justify-content: center; margin-bottom: 24px;">
                <button class="btn-tts" id="test-tts-us">미국식</button>
                <button class="btn-tts" id="test-tts-au">호주식</button>
                <button class="btn-tts" id="test-tts-gb">영국식</button>
            </div>
            
            <div class="test-meaning-box">
                <button id="btn-show-meaning" class="btn-primary" onclick="showTestMeaning()">뜻 보기</button>
                <div id="test-answer" class="hidden">
                    <ul class="test-meaning-list" id="test-answer-list"></ul>
                </div>
            </div>

            <div class="test-controls hidden" id="test-judge-btns">
                <button class="btn-success" style="width: 140px; font-size: 1.125rem;" onclick="judgeAnswer(true)">아는 단어</button>
                <button class="btn-danger" style="width: 140px; font-size: 1.125rem;" onclick="judgeAnswer(false)">모르는 단어</button>
            </div>
        </div>
        <div class="test-container hidden" id="test-result-area">
            <h2 style="margin-bottom: 24px;">시험 결과</h2>
            <div id="test-result-stats" style="font-size: 1.5rem; margin-bottom: 24px;"></div>
            <button class="btn-primary" onclick="showScreen('main-screen')">메인으로 돌아가기</button>
        </div>
    </div>

    <!-- 단어 관리 화면 -->
    <div id="manage-screen" class="screen">
        <div class="header">
            <h1>단어 관리</h1>
            <div>
                <button class="btn-primary" id="btn-toggle-form" onclick="toggleForm()">+ 새로운 단어 추가</button>
                <button class="btn-secondary" onclick="showScreen('main-screen')">⬅ 메인으로</button>
            </div>
        </div>

        <div id="word-form" class="add-form hidden">
            <h3 id="form-title" style="margin-bottom: 16px;">단어 추가</h3>
            <input type="hidden" id="edit-word-id" value="">
            
            <div class="form-group">
                <label>영어 단어</label>
                <input type="text" id="input-eng" class="form-control" placeholder="예: comprehensive">
            </div>
            
            <div class="form-group">
                <label>의미 및 품사</label>
                <div id="meaning-rows-container"></div>
                <button class="btn-secondary" style="margin-top: 8px; font-size: 0.875rem;" onclick="addMeaningRow()">+ 의미 추가</button>
            </div>

            <div style="display: flex; gap: 8px; margin-top: 16px;">
                <button class="btn-primary" onclick="saveWord()">저장</button>
                <button class="btn-secondary" onclick="toggleForm(false)">취소</button>
            </div>
        </div>

        <div class="sort-tabs">
            <button class="sort-tab active" id="tab-latest" onclick="setSort('latest')">Latest (최신순)</button>
            <button class="sort-tab" id="tab-alphabet" onclick="setSort('alphabet')">Alphabet (알파벳순)</button>
            <button class="sort-tab" id="tab-recent-test" onclick="setSort('recent-test')">최근 시험</button>
        </div>

        <div class="word-grid" id="word-list">
            <!-- 단어 카드가 렌더링됨 -->
        </div>
    </div>

    <!-- 시험 기록 조회 화면 -->
    <div id="history-screen" class="screen">
        <div class="header">
            <h1>시험 기록 조회</h1>
            <button class="btn-secondary" onclick="showScreen('main-screen')">⬅ 메인으로</button>
        </div>
        
        <div class="word-grid" id="history-list">
            <!-- 시험 결과 카드가 렌더링됨 -->
        </div>
    </div>
</div>

<!-- 분리된 JavaScript 파일 연결 -->
<script src="app.js"></script>
</body>
</html>
